# logwarden for GitLab CI: findings in the merge request, no internet access needed.
#
# Copy this file into your repository (or a shared CI project) and extend the hidden job:
#
#   include:
#     - local: ci/logwarden.gitlab-ci.yml
#   logwarden:
#     extends: .logwarden
#     needs: [{job: test, artifacts: true}]   # the job that writes the logs, e.g. LOGWARDEN_CAPTURE=logs.jsonl pytest
#     variables:
#       LOGWARDEN_IMAGE: registry.example.com/mirror/logwarden:0.9.0   # your registry's copy of ghcr.io/ingeniator/logwarden
#       LOGWARDEN_LOGS: logs.jsonl
#
# The image contains Weaver and the semantic conventions, so the job works offline.
# It reports and doesn't block: violations (exit 1) are an allowed failure, a broken setup (exit 2) fails.
# The merge request lists new and resolved findings in its Reports tab (Code Quality, every tier),
# and links the HTML report. report.md compares with the target branch's snapshot.

.logwarden:
  image:
    name: $LOGWARDEN_IMAGE
    entrypoint: [""]
  variables:
    LOGWARDEN_IMAGE: ghcr.io/ingeniator/logwarden:0.9.0
    LOGWARDEN_LOGS: logs.jsonl
    LOGWARDEN_ARGS: ""            # extra check options, e.g. --source-root /app or --message-field log
  script:
    - |
      COMPARE=""
      TARGET="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
      BASE="$(printf %s "$TARGET" | tr -c 'A-Za-z0-9._\n-' -)-snapshot.json"   # named after the branch, as the report shows it
      if [ "${CI_COMMIT_BRANCH:-}" != "$CI_DEFAULT_BRANCH" ] && python - "$TARGET" "$BASE" <<'PY'
      # The target branch's snapshot from its latest pipeline, through the job token.
      import os, sys, urllib.parse, urllib.request
      e = os.environ
      url = (f"{e['CI_API_V4_URL']}/projects/{e['CI_PROJECT_ID']}/jobs/artifacts/"
             f"{urllib.parse.quote(sys.argv[1], safe='')}/raw/logwarden-report/snapshot.json"
             f"?job={urllib.parse.quote(e['CI_JOB_NAME'], safe='')}")
      req = urllib.request.Request(url, headers={"JOB-TOKEN": e["CI_JOB_TOKEN"]})
      try:
          with urllib.request.urlopen(req, timeout=30) as r, open(sys.argv[2], "wb") as f:
              f.write(r.read())
      except OSError as err:
          print(f"logwarden: no snapshot from {sys.argv[1]} to compare with ({err})", file=sys.stderr)
          sys.exit(1)
      PY
      then
        COMPARE="--compare $BASE"
      fi
      logwarden check "$LOGWARDEN_LOGS" $COMPARE $LOGWARDEN_ARGS \
        --codequality gl-code-quality.json \
        --snapshot logwarden-report/snapshot.json \
        --markdown logwarden-report/report.md \
        --html logwarden-report/report.html
  allow_failure:
    exit_codes: [1]
  artifacts:
    when: always
    expose_as: logwarden report
    paths: [logwarden-report/]
    reports:
      codequality: gl-code-quality.json

# Scheduled check of production logs: the logs already in Elasticsearch, no change to the service.
#
#   logwarden-production:
#     extends: .logwarden-production
#     rules: [{if: '$CI_PIPELINE_SOURCE == "schedule"'}]
#     variables:
#       LOGWARDEN_IMAGE: registry.example.com/mirror/logwarden:0.9.0
#       LOGWARDEN_ES_URL: https://elasticsearch.example.com:9200
#       LOGWARDEN_ES_INDEX: "logs-shop-*"
#       LOGWARDEN_PUSHGATEWAY: http://pushgateway.example.com:9091   # optional
#   # Settings > CI/CD > Variables: LOGWARDEN_ES_AUTH = "ApiKey ..." or "user:password" (masked)
#   # Build > Pipeline schedules: every hour.
#
# Each run checks the newest lines of the last LOGWARDEN_SINCE, compares with the previous
# scheduled run, and keeps report.md, report.html and snapshot.json. It passes with violations
# (they are the result) and fails when Elasticsearch can't be read or the window is empty, so
# a broken schedule is noticed. The fetched logs hold logged values and are never kept.

.logwarden-production:
  image:
    name: $LOGWARDEN_IMAGE
    entrypoint: [""]
  variables:
    LOGWARDEN_IMAGE: ghcr.io/ingeniator/logwarden:0.9.0
    LOGWARDEN_ES_URL: ""
    LOGWARDEN_ES_INDEX: "logs-*"
    LOGWARDEN_SINCE: "1h"
    LOGWARDEN_ES_SIZE: "10000"
    LOGWARDEN_ES_QUERY: ""        # e.g. kubernetes.namespace_name:shop
    LOGWARDEN_PUSHGATEWAY: ""
    LOGWARDEN_ARGS: ""            # e.g. --profile essential --message-field log
  script:
    - |
      COMPARE=""
      # The previous run's snapshot: from this job's cache, else from the latest pipeline of the
      # branch (which has it only when no other pipeline ran since).
      if [ -s logwarden-cache/snapshot.json ]; then
        cp logwarden-cache/snapshot.json previous-run-snapshot.json
        COMPARE="--compare previous-run-snapshot.json"
      elif python - "$CI_COMMIT_REF_NAME" <<'PY'
      # The previous scheduled run's snapshot, through the job token.
      import os, sys, urllib.parse, urllib.request
      e = os.environ
      url = (f"{e['CI_API_V4_URL']}/projects/{e['CI_PROJECT_ID']}/jobs/artifacts/"
             f"{urllib.parse.quote(sys.argv[1], safe='')}/raw/logwarden-report/snapshot.json"
             f"?job={urllib.parse.quote(e['CI_JOB_NAME'], safe='')}")
      req = urllib.request.Request(url, headers={"JOB-TOKEN": e["CI_JOB_TOKEN"]})
      try:
          with urllib.request.urlopen(req, timeout=30) as r, open("previous-run-snapshot.json", "wb") as f:
              f.write(r.read())
      except OSError as err:
          print(f"logwarden: no previous run to compare with ({err})", file=sys.stderr)
          sys.exit(1)
      PY
      then
        COMPARE="--compare previous-run-snapshot.json"
      fi
      PUSH=""
      if [ -n "$LOGWARDEN_PUSHGATEWAY" ]; then
        PUSH="--pushgateway $LOGWARDEN_PUSHGATEWAY/metrics/job/logwarden/project/$CI_PROJECT_PATH_SLUG"
      fi
      EXPORT="$(mktemp -d)/logwarden-es.json"   # holds logged values: outside the artifacts
      set -- --es "$LOGWARDEN_ES_URL" --index "$LOGWARDEN_ES_INDEX" --since "$LOGWARDEN_SINCE" --size "$LOGWARDEN_ES_SIZE"
      if [ -n "$LOGWARDEN_ES_QUERY" ]; then set -- "$@" --query "$LOGWARDEN_ES_QUERY"; fi
      logwarden fetch "$@" -o "$EXPORT"
      rc=0
      logwarden check "$EXPORT" --format es $COMPARE $PUSH $LOGWARDEN_ARGS \
        --snapshot logwarden-report/snapshot.json \
        --markdown logwarden-report/report.md \
        --html logwarden-report/report.html || rc=$?
      rm -f "$EXPORT"; echo "logwarden: deleted the fetched logs" >&2
      if [ "$rc" -gt 1 ]; then exit "$rc"; fi
      mkdir -p logwarden-cache && cp logwarden-report/snapshot.json logwarden-cache/   # for the next run
  cache:
    key: logwarden-$CI_JOB_NAME_SLUG-$CI_COMMIT_REF_SLUG
    paths: [logwarden-cache/]     # the snapshot only: rule, event and field names, no logged values
    when: on_success
  artifacts:
    when: always
    expose_as: logwarden production report
    paths: [logwarden-report/]
