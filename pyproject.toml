[project]
name = "logwarden"
dynamic = ["version"]
description = "Guardrail for structured logs: checks JSON logs against an OpenTelemetry-based logging standard"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ingeniator" }]
keywords = ["logging", "observability", "opentelemetry", "semconv", "lint", "structlog", "ci", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Logging",
]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
structlog = ["structlog>=24.1"]

[project.urls]
Homepage = "https://github.com/Ingeniator/logwarden"
Documentation = "https://github.com/Ingeniator/logwarden/blob/main/docs/integration.md"
Changelog = "https://github.com/Ingeniator/logwarden/blob/main/CHANGELOG.md"

[project.scripts]
logwarden = "logwarden.cli:main"

[project.entry-points.pytest11]
logwarden = "logwarden.pytest_plugin"

[dependency-groups]
dev = ["pytest>=8", "mcp>=2,<3", "structlog>=24.1", "opentelemetry-sdk>=1.20", "httpx>=0.27", "requests>=2.31"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/logwarden/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/logwarden"]

[tool.hatch.build.targets.wheel.force-include]
"docs/standard.md" = "logwarden/_data/docs/standard.md"
"docs/rules.md" = "logwarden/_data/docs/rules.md"

[tool.hatch.build.targets.sdist]
include = ["src", "docs", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["weaver: runs the real weaver binary (downloads it on first use)"]
