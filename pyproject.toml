[project]
name = "logwarden-pytest"
version = "0.2.0"
description = "pytest plugin that captures a test run's JSON logs for the logwarden check"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Ingeniator/logwarden"

[project.entry-points.pytest11]
logwarden = "logwarden_pytest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/logwarden_pytest"]
