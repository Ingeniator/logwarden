name: release
# Tag vX.Y.Z  -> build, publish to PyPI, create the GitHub release from docs/releases/vX.Y.Z.md.
#               and push the image ghcr.io/ingeniator/logwarden:X.Y.Z and :latest.
# Manual run  -> dry run: publish X.Y.Z.devN to TestPyPI and push the image tag X.Y.Z.devN.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Resolve version
        id: version
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/logwarden/__init__.py)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
            grep -q '^\*\*Status:\*\* Released' "docs/releases/v$v.md" \
              || { echo "docs/releases/v$v.md is not marked Released (verify the notes first)"; exit 1; }
          else
            v="$v.dev${GITHUB_RUN_NUMBER}"
            sed -i "s/^__version__ = .*/__version__ = \"$v\"/" src/logwarden/__init__.py
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Use the release version
        env:
          V: ${{ needs.build.outputs.version }}
        run: sed -i "s/^__version__ = .*/__version__ = \"$V\"/" src/logwarden/__init__.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: tags
        env:
          V: ${{ needs.build.outputs.version }}
        run: |
          img=ghcr.io/ingeniator/logwarden
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tags=$img:$V,$img:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$img:$V" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.version=${{ needs.build.outputs.version }}

  github-release:
    if: github.ref_type == 'tag'
    needs: [build, pypi, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
        run: gh release create "v$V" dist/* --title "logwarden v$V" --notes-file "docs/releases/v$V.md"
