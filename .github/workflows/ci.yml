name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Remove jq (logwarden must not need it)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f "$(command -v jq)"
          if command -v jq; then echo "jq still present"; exit 1; fi
      - name: Tests (includes real weaver runs)
        run: uv run --python ${{ matrix.python }} pytest -q -ra

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: good logs pass
        id: good
        uses: ./
        with:
          logs: examples/good.jsonl
      - name: bad logs, report only, do not fail
        uses: ./
        with:
          logs: examples/bad.jsonl
          fail: "false"
          compare: "false"
          upload: "false"
      - name: bad logs fail
        id: bad
        continue-on-error: true
        uses: ./
        with:
          logs: examples/bad.jsonl
          compare: "false"
          artifact-name: logwarden-report-bad
      - name: expect failure, and the outputs
        env:
          GOOD: ${{ steps.good.outputs.violations }}
          BAD: ${{ steps.bad.outputs.violations }}
        run: |
          [ "${{ steps.bad.outcome }}" = failure ]
          [ "$GOOD" = 0 ] && [ "$BAD" = 10 ]

  # Compares with main's snapshot (Actions cache) and comments on the PR (v0.7.0 claim 4).
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          logs: tests/data/review.jsonl
          comment: "true"

  # Without write permission (like a fork's PR) the comment step warns and the job passes.
  review-readonly:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          logs: examples/good.jsonl
          comment: "true"
          compare: "false"
          upload: "false"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Wheel installs and registers the pytest plugin in a clean venv
        run: |
          uv venv /tmp/v && uv pip install --python /tmp/v/bin/python dist/*.whl pytest
          mkdir -p /tmp/t && printf 'import json, logging\ndef test_x():\n    logging.getLogger("a").info(json.dumps({"event":"x_done"}))\n' > /tmp/t/test_x.py
          cd /tmp/t && LOGWARDEN_CAPTURE=/tmp/t/logs.jsonl /tmp/v/bin/python -m pytest -q
          grep -q x_done /tmp/t/logs.jsonl
          /tmp/v/bin/logwarden check "$GITHUB_WORKSPACE/examples/good.jsonl"
      - name: Core wheel has no structlog; logwarden.logging names the extra
        run: |
          if /tmp/v/bin/python -c "import structlog" 2>/dev/null; then echo "structlog in core install"; exit 1; fi
          /tmp/v/bin/python -c "import logwarden.logging" 2>&1 | tee /tmp/err.txt || true
          grep -q "logwarden\[structlog\]" /tmp/err.txt
      - name: "[structlog] extra works in a clean venv"
        run: |
          uv venv /tmp/s && uv pip install --python /tmp/s/bin/python "$(ls dist/*.whl)[structlog]"
          /tmp/s/bin/python -c "from logwarden.logging import configure; configure('s','1','test').info('extra_works')" | tee /tmp/s.jsonl
          grep -q '"event": "extra_works"' /tmp/s.jsonl

  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: examples/recipes/go/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Node (pino), Node over OTLP, Go (slog), Java (logback) output passes the check
        run: examples/recipes/check.sh node node-otlp go java
      - name: Recipe source passes lint-code (Semgrep via uvx)
        run: uv run logwarden lint-code examples/recipes

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 and linux/arm64 (each build runs a check inside the image)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
      - name: Build linux/amd64 for the tests below
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: logwarden:test
      - name: Offline check, as root and as another user
        run: |
          set +e
          docker run --rm --network none -v "$PWD/examples:/work" logwarden:test check bad.jsonl --json > bad.json
          rc=$?
          set -e
          [ "$rc" -eq 1 ]
          python3 -c "import json; d=json.load(open('bad.json')); assert d['violations'] == 10, d['violations']"
          docker run --rm --network none -v "$PWD/examples:/work" logwarden:test check good.jsonl
          docker run --rm --network none --user 12345 -v "$PWD/examples:/work" logwarden:test check good.jsonl
      - name: capture inside the container
        run: |
          mkdir -p /tmp/cap && chmod 777 /tmp/cap
          docker run -d --name cap -p 4318:4318 -v /tmp/cap:/work logwarden:test capture --host 0.0.0.0 -o out.jsonl
          sleep 3
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://127.0.0.1:4318/v1/logs uv run python tests/data/otlp_emit.py good
          sleep 1
          docker stop -t 60 cap
          docker logs cap 2>&1 | tee /tmp/cap.log
          [ "$(docker inspect cap -f '{{.State.ExitCode}}')" = "0" ]
          grep -q "captured 2 log records" /tmp/cap.log && grep -q "0 violations" /tmp/cap.log

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict plugin
