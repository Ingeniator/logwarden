name: pages

# The docs site at https://ingeniator.github.io/logwarden/ (mkdocs.yml, docs_hooks.py).
on:
  push:
    branches: [main]
    paths: [docs/**, README.md, mkdocs.yml, docs_hooks.py, .github/workflows/pages.yml]
  pull_request:
    paths: [docs/**, README.md, mkdocs.yml, docs_hooks.py, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build (strict, so broken links and anchors fail)
        run: uvx --with mkdocs-material==9.5.50 --from mkdocs==1.6.1 mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
