groups:
  - id: registry.shop
    type: attribute_group
    brief: Shop fields.
    attributes:
      - id: shop.order.kind
        type: string
        brief: Kind of order.
        stability: development
  - id: metric.shop.orders
    type: metric
    metric_name: shop.orders
    brief: Orders placed.
    instrument: counter
    unit: "{order}"
    stability: development
    attributes:
      - ref: shop.order.kind
